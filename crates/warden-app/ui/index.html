<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>warden</title>
    <link rel="stylesheet" href="chrome-core.css" />
    <style>
      /* Page shell only — the sidebar interior (banner, rows, dots, kill-confirm, error bar, resize)
         lives in chrome-core. This keeps warden's window topology: a native libghostty surface
         composited ABOVE the webview shows through #terminal-hole, so the sidebar is a normal DOM
         column beside a transparent hole. The window is transparent → every painted surface here
         must stay OPAQUE or it leaks the wallpaper. */
      /* The ONE source for the pane "ground" colour — the opaque backstop colour shown wherever
         nothing else paints. Two rules read this token (`.pane` and `#empty-state`/`#empty-state-2`,
         below) instead of each carrying their own literal — this repo's rule against restating a
         value that already lives somewhere. */
      :root { --pane-ground: #0e1516; }
      html, body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #app { height: 100%; display: flex; flex-direction: row; }
      /* The chrome-core mount container. chrome-core's own `#cc-titlebar` strip (the `appName`
         mount config) now owns the traffic-light inset — no page-level padding-top here; chrome-core
         adds `.cc-root` (opaque flex column). Width is the density-aware token, overridden inline by
         the resize controller. */
      #sidebar { width: var(--cc-sidebar-w, 240px); flex: none; }
      /* #terminal-hole is a flex row of at most two panes plus a divider between them. Unsplit
         (the common case), #pane-secondary and #pane-divider are `hidden` — the SOLE authority
         for that is the `.split` class on #terminal-hole (toggled by setSplitVisible, below):
         #pane-divider and #pane-secondary are NEVER given an unconditional `display` here, only
         one scoped to `#terminal-hole.split`, so an author rule can never out-specificity the
         `hidden` attribute's UA `display: none` the way the unscoped divider rule once did (fix
         round 1, CRITICAL 1 — that bug rendered the divider, 6px narrower than before, on EVERY
         unsplit tab, because author-origin CSS always beats the UA stylesheet regardless of the
         `hidden` attribute being present). `hidden` is kept in lockstep with `.split` purely for
         semantics/JS convenience (`secEl.hidden` reads) — setSplitVisible is the only place that
         ever sets either, so they cannot diverge. */
      #terminal-hole { flex: 1; background: transparent; position: relative; display: flex;
        overflow: hidden; /* clips the focused pane's halo — see `.pane.focused` */ }
      /* box-sizing: border-box + an always-present (transparent-by-default) border keeps the pane's
         OUTER box identical whether or not `.focused` is applied — only the border's COLOR
         changes, never the box's size, so toggling focus can never jitter layout for a frame.
         Fix round 1, IMPORTANT 1: this alone does NOT make the marker visible — `reportRect`
         (ui/index.html script) must report the CONTENT box (inset by this border), not the border
         box `getBoundingClientRect()` returns, or the native surface — composited ABOVE this
         webview — is sized right over the border and occludes it the instant a pane is live,
         which is exactly when the marker matters.
         Fix round 2, CRITICAL: that content-box inset opened a NEW gap — `#empty-state`'s own
         `inset: 0` already resolves against the padding box (inside the border; see that rule's
         comment), so once the native surface only covers the content box too, nothing paints the
         1px BORDER ring itself — a hairline of desktop wallpaper on every pane, unsplit tabs
         included (the common case, and one that never had a marker to fix). An opaque
         `background` here covers it — CSS backgrounds paint under the border by default — the
         same "ground always on, never toggled" ruling `#empty-state` already applies, just one
         box further out; makes an uncovered ring unrepresentable rather than something the
         geometry has to get exactly right. `--pane-ground` is the SAME token `#empty-state` uses
         (declared once, at `:root`) — the two rules cover different boxes (this one the OUTER
         border box including the ring, `#empty-state` the inner content box) for different
         historical reasons, but they must never carry two different literals for one colour.
         Only visible while split (a single unsplit pane needs no "which one types" marker) —
         Step 3's discoverability requirement ("the focused pane must be visibly marked").

         The ring colour is the WINDOW's colour (`--accent`, set on the root by `applyDto` from the
         window DTO — the same value chrome-core paints the banner) pushed to an "electric"
         register with relative colour syntax: the window's own HUE, saturation floored at 85 and
         lightness pinned at 62, so a dark navy window rings electric blue and a forest green rings
         neon green — the pane belongs to its window at a glance, and the ring still pops against
         the dark ground whatever the user picked. The same lift-the-hue idea as chrome-core's
         `liftColour` for the sidebar's active bar, so the two accents read as one. The neutral
         no-colour fallback (chrome-core's `NEUTRAL_COLOUR` slate, hue ≈220) resolves to an
         electric blue, so a colourless window gets a ring, not grey. Same formula, same
         reasoning, as shell-core's `.hole.focused` in `detach.html` — the two rules must stay
         identical, the way the two dividers do.

         The halo (`box-shadow`) is the "electric" glow. The native surface composites ABOVE this
         webview and covers the content box, so an INSET glow would be invisible; an OUTER one
         shows in the divider strip between the panes — exactly where the eye looks to answer
         "which one is typing". `z-index: 1` paints it over the divider (a later sibling of the
         primary), and `#terminal-hole` clips it so it never spills onto the sidebar or the
         transparent canvas at the window edge. */
      .pane { position: relative; background: var(--pane-ground); box-sizing: border-box;
        border: 1px solid transparent; }
      #terminal-hole.split .pane.focused { z-index: 1;
        --ring: hsl(from var(--accent, #6b7280) h calc(max(s, 85)) 62);
        border-color: var(--ring); box-shadow: 0 0 6px var(--ring); }
      #pane-primary { flex: 1 1 0; }
      #pane-secondary { flex: 1 1 0; display: none; }
      #terminal-hole.split #pane-secondary { display: block; }
      /* The divider is a 1px line inside a 5px grab strip: 2px of pane ground either side of
         the line, all OPAQUE. This column is its own box, painted directly on the (transparent)
         webview canvas — it sits BETWEEN the two panes, not over either one's backstop — so a
         translucent colour here blends straight through to the desktop wallpaper behind the
         window (the original rgba(255,255,255,.18) was a faint but real leak). The strip's ground
         is `--pane-ground` (the panes' own colour, so the strip reads as the gap between two
         terminals, not a bar) and the line is #393f40, a flat neutral in the same register as the
         app's dark chrome. The strip is wider than the line because a 1px target cannot be
         grabbed; the extra width is invisible by construction. No close control rides it — a
         split ends only by the second shell exiting (`warden:pane-closed`), never from the chrome.
         (Same values, same reasoning, as shell-core's `.divider` in the detached page.) */
      #pane-divider { flex: 0 0 5px; cursor: col-resize; display: none;
        background: linear-gradient(to right, var(--pane-ground) 2px, #393f40 2px, #393f40 3px,
          var(--pane-ground) 3px); }
      #terminal-hole.split #pane-divider { display: block; }
      /* A config split with `side = "left"` puts the SECOND pane first. Flex `order` only —
         the DOM order (primary, divider, secondary) and the pane→index contract
         (`reportRect`'s 0 = primary, 1 = secondary) are untouched, so every rect, focus and
         close path stays index-based. Toggled by setSplitVisible alongside `.split`. */
      #terminal-hole.secondary-left #pane-secondary { order: -2; }
      #terminal-hole.secondary-left #pane-divider { order: -1; }
      /* Empty-state — the opaque backstop for a hole with no live surface. The window is
         transparent and the terminal NSView composites ABOVE the webview, so an uncovered hole
         leaks the desktop. Fix round 1, IMPORTANT 4 (a ruling, not a bug fix): the GROUND
         (this rule, the opaque background) is now ALWAYS ON — never toggled — so "an uncovered
         hole" is unrepresentable rather than a state paintEmptyState has to get right on every
         transient (mid-drag, a spawn race, a tab switch). It is invisible whenever a live pane
         actually covers the hole (occluded by the NSView above it) and covering whenever it
         doesn't, by construction. Only the ILLUSTRATION (the child svg) stays conditional, via
         paintEmptyState — an always-visible icon would flash at the hole's edge during a live
         resize, which the ground alone (a flat colour, unnoticeable) does not. #empty-state
         backstops #pane-primary; #empty-state-2 backstops #pane-secondary. `background` reads
         `--pane-ground` (declared once, at `:root`) — the SAME token `.pane`'s own background
         reads (fix round 2, CRITICAL) — never restate the literal in a second place. */
      #empty-state, #empty-state-2 {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--pane-ground);
        user-select: none;
        -webkit-user-select: none;
      }
      #empty-state svg, #empty-state-2 svg { width: 160px; height: auto; opacity: 0.9; }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- chrome-core mounts here (adds .cc-root + banner/rows/resize), including its own
           `#cc-titlebar` strip (the `appName` mount config) over the traffic-light zone; the
           sidebar BODY drag is stamped by chrome-core per the `windowDrag` DTO flag (from
           `sidebar_drag`). -->
      <aside id="sidebar" data-tauri-drag-region></aside>
      <div id="terminal-hole">
        <div id="pane-primary" class="pane">
          <div id="empty-state">
            <svg id="empty-state-art" viewBox="108 52 296 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="no tab selected">
              <path d="M 152 72 L 360 72 Q 384 72 384 96 L 384 256 C 384 360 330 412 256 452 C 182 412 128 360 128 256 L 128 96 Q 128 72 152 72 Z"
                    fill="#283034"/>
              <g fill="none" stroke="#5c676c" stroke-linecap="round" stroke-linejoin="round">
                <path d="M 186 126 L 270 230 L 186 334" stroke-width="18" opacity="0.3"/>
                <path d="M 208 152 L 270 230 L 208 308" stroke-width="20" opacity="0.55"/>
                <path d="M 230 178 L 270 230 L 230 282" stroke-width="26" opacity="1"/>
              </g>
              <rect x="296" y="210" width="34" height="40" rx="7" fill="#5c676c"/>
            </svg>
          </div>
        </div>
        <!-- Hidden when unsplit — the common case, identical to the single-hole layout — via
             setSplitVisible(false), the SOLE toggle for both `.split` and `hidden` (see the
             CSS comment above #terminal-hole). `split_pane` and a config split turn it on; the
             second shell exiting (`warden:pane-closed`) turns it off. -->
        <div id="pane-divider" hidden></div>
        <div id="pane-secondary" class="pane" hidden>
          <div id="empty-state-2">
            <svg id="empty-state-2-art" viewBox="108 52 296 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="secondary pane empty">
              <path d="M 152 72 L 360 72 Q 384 72 384 96 L 384 256 C 384 360 330 412 256 452 C 182 412 128 360 128 256 L 128 96 Q 128 72 152 72 Z"
                    fill="#283034"/>
              <g fill="none" stroke="#5c676c" stroke-linecap="round" stroke-linejoin="round">
                <path d="M 186 126 L 270 230 L 186 334" stroke-width="18" opacity="0.3"/>
                <path d="M 208 152 L 270 230 L 208 308" stroke-width="20" opacity="0.55"/>
                <path d="M 230 178 L 270 230 L 230 282" stroke-width="26" opacity="1"/>
              </g>
              <rect x="296" y="210" width="34" height="40" rx="7" fill="#5c676c"/>
            </svg>
          </div>
        </div>
      </div>
    </div>
    <script src="chrome-core.js"></script>
    <script>
      // warden's chrome controller: binds chrome-core's ChromeSidebar (the view) to warden's Tauri
      // backend + libghostty native surface. The sidebar rendering lives in chrome-core; this maps
      // callbacks→commands and events→setters, and keeps warden's content-area plumbing: the
      // native-surface hole geometry (reportRect), the empty-state placeholder, per-window event
      // filtering (forMe), and the first-probe handshake.
      const { invoke } = window.__TAURI__.core;
      const { listen } = window.__TAURI__.event;

      function invokeSafe(cmd, args) {
        return invoke(cmd, args).catch((err) => console.error("warden: IPC " + cmd + " failed", err));
      }

      let myLabel = null; // this window's Tauri label — emit_to leaks to siblings, so filter on it
      let sb = null;
      let activeId = null; // controller mirror of the active tab, for the empty-state placeholder
      let activeLive = false; // …and whether a live surface actually covers the PRIMARY hole for it
      let secondaryLive = false; // …and the SECONDARY hole, when the active tab is split
      const badges = new Set(); // tab ids with an unread notification/bell badge
      const detached = new Set(); // tab ids popped out into their own window (onSelect → raise it)
      // tab id → whether its secondary pane is live, mirrored from TabDto.secondary_spawned on
      // every snapshot (init_tabs / warden:refresh) — the same tab-liveness payload `spawned`
      // (primary) already rides in. setActiveId reads this by id so secondaryLive tracks the
      // active tab without every caller having to thread a second liveness bool through.
      const secondarySpawnedById = new Map();
      // tab id → which pane last received a focus_pane() call: 0 (primary, the default — matches
      // the Registry's own default and what a fresh `split_pane` resets to) or 1
      // (secondary). Read by updateFocusMarker so the visible marker (Step 3) survives a tab
      // switch, mirroring how `secondarySpawnedById` mirrors backend liveness. This mirror is
      // written ONLY by the things that actually change `Registry`'s own `t.focused` — a pane
      // mousedown (focus_pane), a split (defaults to primary), a close (resets to primary), and
      // the backend's own `warden:pane-focused` for a native click — so it can't drift from
      // backend truth through any path that doesn't also report here.
      const focusedPaneById = new Map();
      // tab id → whether it STRUCTURALLY has a secondary pane (Registry::is_split) — distinct
      // from `secondarySpawnedById` (LIVENESS: is that secondary actually spawned). Fix round 1,
      // IMPORTANT 2: `setActiveId` used to derive split-visibility from the liveness proxy alone,
      // with no way to tell whether the AUTHORITATIVE answer (`activate_tab`'s own `res.split`)
      // had already landed for this id — so whichever of onSelect's own call or a later
      // `warden:refresh`'s `applyDto` happened to run LAST would win, and they could disagree.
      // Written only by writers that KNOW the true answer — every snapshot (`toComponentDto`
      // rebuilds it from `TabDto.split`, the registry's own structural fact), onSelect's
      // `res.split`, `splitActiveTab` (`Registry::split` is infallible, so structurally true the
      // instant it's called), and `collapseSplit` (false) — and read by EVERY `setActiveId` call,
      // hinted or not, so all of them converge on the same value once any one of them has
      // recorded it.
      const splitById = new Map();
      // tab id → { side, size } from `TabDto.split_layout`, rebuilt on every snapshot. Presence
      // here is the chrome's one test for "this tab's split is declared in config": such a tab
      // never touches localStorage (the config is its memory), a closed pane holds only until relaunch, and
      // a drag is remembered in `ratioOverride` below rather than persisted.
      const splitLayoutById = new Map();
      // tab id → the PRIMARY's dragged fraction for a config-split tab, held only while the
      // tab's terminals are live — cleared when it goes cold (applyUnloaded, a snapshot with no
      // live pane) and when its split collapses. An app restart clears it by construction.
      const ratioOverride = new Map();
      const primaryFracFromLayout = (layout) => 1 - layout.size; // `size` is the SECOND pane's share
      // tab id → 'on' | 'ghost' | 'off' (probe presence), for probe-enabled tabs. The backend
      // sends these strings verbatim (they ARE chrome-core's wire values) — do not re-derive
      // them from a boolean; presence has been 3-state since exit 3 ("recoverable") shipped.
      const session = new Map();

      // A RUNTIME split persists here, outside the TOML; a config split's memory is the config
      // itself (see `splitLayoutById`). Same home as the sidebar width. Key presence IS the
      // split flag; the value carries only the divider ratio.
      const splitKey = (tabId) => `split:${myLabel}:${tabId}`;

      function saveSplit(tabId, ratio) {
        if (splitLayoutById.has(tabId)) { ratioOverride.set(tabId, ratio); return; }
        try { localStorage.setItem(splitKey(tabId), JSON.stringify({ ratio })); } catch (e) {}
      }
      function clearSplit(tabId) {
        ratioOverride.delete(tabId);
        try { localStorage.removeItem(splitKey(tabId)); } catch (e) {}
      }
      // The ratio a split of `tabId` should show: a config split's in-memory override, else its
      // declared size; a runtime split's persisted ratio. `null` = no split on record.
      function loadSplit(tabId) {
        const layout = splitLayoutById.get(tabId);
        if (layout) {
          const o = ratioOverride.get(tabId);
          return { ratio: Number.isFinite(o) ? o : primaryFracFromLayout(layout) };
        }
        try {
          const raw = localStorage.getItem(splitKey(tabId));
          if (!raw) return null;
          const v = JSON.parse(raw);
          const r = Number(v && v.ratio);
          return Number.isFinite(r) && r > 0.05 && r < 0.95 ? { ratio: r } : { ratio: 0.5 };
        } catch (e) { return null; }
      }
      // The divider ratio a pop-out of `tabId` should carry, or null for an unsplit tab.
      // Pop-out is whole-tab, so a split tab's second pane goes with it and the detached
      // window has to lay out two holes at the SAME ratio the tab has here — otherwise the
      // terminal visibly jumps width the moment it pops out. Read via `loadSplit`, which
      // resolves a config split to its in-memory override (or its declared `size` if none)
      // and a runtime split to its persisted ratio. The backend treats this as advisory: it
      // decides the hole count from the surfaces it actually detached, so a stale or absent
      // value can only cost the right WIDTH, never a hole with no terminal.
      function popOutRatio(tabId) {
        const p = loadSplit(tabId);
        return p ? p.ratio : null;
      }

      // Drop keys for tabs this window no longer has. Without it a scanned-project tab that
      // disappears leaves its key behind forever, and a later tab reusing the id inherits a
      // split nobody asked for.
      //
      // Fix round 1, IMPORTANT 3: the WHOLE body is wrapped, not just removeItem — where
      // localStorage throws, it throws on EVERY member, including `.length` and `.key()`. This
      // runs inside the snapshot builder (toComponentDto), which neither init() nor the
      // warden:refresh listener wraps, so an unguarded read here didn't just skip eviction — it
      // threw out of the builder before it returned, silently stopping the tab bar from ever
      // refreshing again in any environment where storage is unavailable.
      function evictSplits(currentTabIds) {
        try {
          const prefix = `split:${myLabel}:`;
          // A tab that gained a config split evicts too — its key would otherwise re-split it
          // from stale memory if the config split were later removed.
          const live = new Set([...currentTabIds].filter((id) => !splitLayoutById.has(id)));
          for (let i = localStorage.length - 1; i >= 0; i--) {
            const k = localStorage.key(i);
            if (k && k.startsWith(prefix) && !live.has(k.slice(prefix.length))) {
              localStorage.removeItem(k);
            }
          }
        } catch (e) {}
      }

      // In-app updates are a chrome-core capability (check / install / relaunch + the 6h re-check
      // cadence); see chrome-core's dividing-line decision. This controller only passes warden's
      // `auto_update` gate (below, `autoUpdate` in the mount config) and forwards the menu event to
      // sb.checkForUpdateNow(). warden keeps its own updater *identity* — endpoint, pubkey, plugin
      // registration — in tauri.conf.json / Rust.

      const forMe = (e) => !(e.payload && e.payload.label && myLabel && e.payload.label !== myLabel);

      // Fix round 1, IMPORTANT 1: the rect handed to `set_hole_rect` must be the pane's CONTENT
      // box, not its border box. `getBoundingClientRect()` returns the border box, and the native
      // surface is sized to exactly what's reported here — so reporting the border box put the
      // surface right over the `.focused` marker's border (see the CSS comment on `.pane`),
      // occluding it the instant a pane went live, which is exactly when it matters. Read the
      // ACTUAL computed border width rather than hardcoding "1px" so this can never silently
      // drift from the CSS rule that draws it. `#empty-state`/`#empty-state-2`'s `inset: 0` are
      // unaffected — `inset` on an absolutely-positioned child is already relative to its
      // positioned ancestor's PADDING box (inside the border), so they already matched this
      // content box before the native surface did.
      function contentRect(el) {
        const r = el.getBoundingClientRect();
        const cs = getComputedStyle(el);
        const bl = parseFloat(cs.borderLeftWidth) || 0;
        const bt = parseFloat(cs.borderTopWidth) || 0;
        const br = parseFloat(cs.borderRightWidth) || 0;
        const bb = parseFloat(cs.borderBottomWidth) || 0;
        return {
          x: r.x + bl,
          y: r.y + bt,
          width: Math.max(0, r.width - bl - br),
          height: Math.max(0, r.height - bt - bb),
        };
      }

      // Report each VISIBLE pane's CONTENT rect to the native layer so its libghostty surface
      // tracks it, by pane index (0 = primary, 1 = secondary — Task 4's `set_hole_rect` contract).
      // The secondary is only reported while its pane is un-hidden — Rust never sees a rect for a
      // pane the chrome isn't showing.
      function reportRect() {
        const p = contentRect(document.getElementById("pane-primary"));
        invokeSafe("set_hole_rect", { rect: { x: p.x, y: p.y, width: p.width, height: p.height }, pane: 0 });
        const secEl = document.getElementById("pane-secondary");
        if (!secEl.hidden) {
          const s = contentRect(secEl);
          invokeSafe("set_hole_rect", { rect: { x: s.x, y: s.y, width: s.width, height: s.height }, pane: 1 });
        }
      }

      // The empty-state elements' GROUND (opaque background) is always on now — see the CSS
      // comment on #empty-state. Only their ILLUSTRATION (the child svg) is decided here, and
      // only for cosmetic reasons: showing the "no tab" artwork while a live surface actually
      // covers the hole is invisible either way (occluded by the NSView above it), but an
      // always-visible icon would flash at the hole's edge during a live resize.
      //
      // Per-hole, not per-tab: a live primary beside a COLD secondary must still show the
      // secondary's own artwork — a single tab-level decision would leave it looking covered
      // when it isn't. So each hole's artwork is decided on its OWN pane's liveness.
      function paintEmptyState() {
        const coveredP = activeId !== null && activeLive;
        document.getElementById("empty-state-art").style.display = coveredP ? "none" : "";
        const secEl = document.getElementById("pane-secondary");
        const coveredS = !secEl.hidden && activeId !== null && secondaryLive;
        document.getElementById("empty-state-2-art").style.display =
          secEl.hidden || coveredS ? "none" : "";
      }
      // `live` = does a surface cover the PRIMARY hole for this tab? Callers that can't know yet (a
      // click, before the spawn returns) pass false; the placeholder they briefly paint is invisible
      // anyway (any live surface composites over it), so an honest false never flickers.
      // `secondaryLive` is derived here, not threaded through every caller: it mirrors whatever the
      // last TabDto snapshot said for this tab's secondary pane (see `secondarySpawnedById`, set
      // alongside `spawned`/activeLive's own source in `toComponentDto`).
      // `splitHint`, when given, is the AUTHORITATIVE answer (`activate_tab`'s own `split` field —
      // see its Rust doc comment) — the caller that HAS it (onSelect, right after activate_tab
      // resolves) records it into `splitById` here. Every call — hinted or not — then reads
      // `splitById` first and only falls back to `secondaryLive` (liveness) when that id has no
      // recorded answer yet. Fix round 1, IMPORTANT 2: this is what makes the two writers agree
      // regardless of arrival order — a hot-reload refresh landing before OR after onSelect's own
      // resolution reads the SAME `splitById` entry once either has written it, instead of one
      // writer's proxy silently overwriting the other's authoritative answer.
      function setActiveId(id, live, splitHint) {
        activeId = id;
        activeLive = !!live;
        secondaryLive = id !== null && !!secondarySpawnedById.get(id);
        if (id !== null && splitHint !== undefined) splitById.set(id, !!splitHint);
        const split = id !== null && splitById.has(id) ? splitById.get(id) : secondaryLive;
        // THIS tab's own split state, not whatever `#terminal-hole` was left showing for the tab
        // switched away from — `setSplitVisible` is the sole authority (carried finding #1), so
        // every path that lands here (tab switch, refresh, unload's neighbour-follow) re-asserts
        // it rather than leaving a split tab's layout bleeding into the next tab's single hole.
        // Subsumes paintEmptyState()/updateFocusMarker()/reportRect(), which it already calls.
        setSplitVisible(split);
      }

      // The Step 3 discoverability marker: which pane will receive typing. Reads
      // `focusedPaneById` for the ACTIVE tab (absent → 0/primary, the shared default with the
      // backend) and paints it on both pane elements; the CSS only renders it while split (see
      // the `.pane.focused` rule), so this runs unconditionally rather than every caller having
      // to know the split state.
      function updateFocusMarker() {
        // No marker for a popped-out tab: its panes are in the detached window and these two
        // are empty, so a ring here would point at nothing.
        const f = activeId !== null && !detached.has(activeId) ? focusedPaneById.get(activeId) || 0 : -1;
        document.getElementById("pane-primary").classList.toggle("focused", f === 0);
        document.getElementById("pane-secondary").classList.toggle("focused", f === 1);
      }

      // Clears both panes' drag-set inline `flex` (see the divider-drag IIFE's `setSplit`).
      // Load-bearing on close: once the secondary is hidden, a leftover `flex: 0.3 1 0` on the
      // primary — now the flex row's SOLE child — only claims 30% of the free space per Flexbox
      // §9.7 rather than filling the hole, leaving the rest genuinely uncovered (not backstopped
      // — the empty-state ground lives on the PANES, and an uncovered flex remainder is outside
      // either pane entirely).
      function resetSplit() {
        document.getElementById("pane-primary").style.flex = "";
        document.getElementById("pane-secondary").style.flex = "";
      }
      // Sets the divider ratio on both panes' flex-basis WITHOUT touching visibility — shared by
      // the live drag handler (the divider IIFE, below) and split restoration (setSplitVisible),
      // so there is exactly one clamp (matching the drag's own bounds) and one place either
      // applies a ratio. Callers decide when to reveal the result and re-report rects; calling
      // this before the pane is un-hidden is what lets a restored split appear at its saved
      // ratio on the FIRST reportRect rather than flashing 50/50 first.
      //
      // The 0.1/0.9 band mirrors warden-config's SPLIT_SIZE_MIN/SPLIT_SIZE_MAX
      // (crates/warden-config/src/resolve.rs) — this JS can't reach that Rust constant across
      // the IPC boundary, so it carries the same band as a literal that must be kept in
      // agreement by hand if that band ever moves.
      function applySplitFlex(frac) {
        const f = Math.max(0.1, Math.min(0.9, frac));
        document.getElementById("pane-primary").style.flex = f + " 1 0";
        document.getElementById("pane-secondary").style.flex = (1 - f) + " 1 0";
        return f;
      }
      // The SOLE authority for split visibility, AND the one place a split's side
      // (`.secondary-left`) and ratio are applied when showing one: toggles `.split` on
      // #terminal-hole (which the CSS keys #pane-divider's and #pane-secondary's `display` off
      // — see that comment) and keeps the `hidden` attribute in lockstep on both elements purely
      // for semantics/JS convenience, so the two mechanisms can never contradict each other (fix
      // round 1, CRITICAL 1). Closing always resets the drag ratio. Its real callers: `setActiveId`
      // (every tab switch/refresh re-asserts THIS tab's own split state), `splitActiveTab`/
      // `collapseSplit` (⌘D / a secondary exiting on its own). Never poke
      // `hidden`/`.split` directly.
      function setSplitVisible(isSplit) {
        const hole = document.getElementById("terminal-hole");
        hole.classList.toggle("split", !!isSplit);
        document.getElementById("pane-divider").hidden = !isSplit;
        document.getElementById("pane-secondary").hidden = !isSplit;
        const layout = isSplit && activeId !== null ? splitLayoutById.get(activeId) : null;
        hole.classList.toggle("secondary-left", !!layout && layout.side === "left");
        if (isSplit && activeId !== null) {
          // THIS tab's own ratio, every time — the shared pane elements keep whatever flex the
          // last split tab shown left them at. Ahead of reportRect so the first report is right.
          const p = loadSplit(activeId);
          applySplitFlex(p ? p.ratio : 0.5);
        } else {
          resetSplit();
        }
        reportRect();
        paintEmptyState();
        updateFocusMarker();
      }

      // The tail for a split ending — a secondary's process exiting on its own
      // (`warden:pane-closed`, docked or in a popped-out window) is the only way one ends.
      // Mirrors `Registry::close_secondary` always resetting focus to the primary, so
      // `focusedPaneById` can't drift from backend truth (see its own doc comment). Only touches
      // the DOM when `id` is the tab actually on screen — a background tab's split collapsing
      // must not repaint a hole showing a different tab.
      function collapseSplit(id) {
        secondarySpawnedById.set(id, false);
        splitById.set(id, false); // the authoritative answer, not just the liveness proxy
        focusedPaneById.set(id, 0);
        clearSplit(id); // the split is gone — drop its persisted ratio AND its in-memory
                        // override; dropping the override is what lets a later ⌘D come back
                        // at the declared ratio instead of a stale drag position
        if (id === activeId) {
          secondaryLive = false; // kept in step with the map read above, not just left for the
                                  // next setActiveId to notice
          setSplitVisible(false);
        }
      }

      // Map a warden window snapshot → chrome-core's DTO. Attention (notify) + presence (probe) are
      // chrome-side state (Sets/Map), folded in here so a full update() restores them; killable +
      // warn come from the snapshot. No `active` field — warden is component-authoritative (the
      // component preserves selection + falls back to the first tab, firing onSelect to activate it).
      function toComponentDto(dto) {
        const ids = new Set(dto.tabs.map((t) => t.id));
        badges.forEach((id) => { if (!ids.has(id)) badges.delete(id); });
        session.forEach((_, id) => { if (!ids.has(id)) session.delete(id); });
        secondarySpawnedById.forEach((_, id) => { if (!ids.has(id)) secondarySpawnedById.delete(id); });
        splitById.forEach((_, id) => { if (!ids.has(id)) splitById.delete(id); });
        splitLayoutById.forEach((_, id) => { if (!ids.has(id)) splitLayoutById.delete(id); });
        ratioOverride.forEach((_, id) => { if (!ids.has(id)) ratioOverride.delete(id); });
        // Rebuild the detached-id set from the snapshot (authoritative), so onSelect can route a
        // click on a popped-out row to raise-its-window rather than activate a nonexistent surface.
        detached.clear();
        dto.tabs.forEach((t) => {
          if (t.detached) detached.add(t.id);
          secondarySpawnedById.set(t.id, !!t.secondary_spawned);
          // Rebuilt from EVERY snapshot, the same way `detached` above is — `TabDto.split` is
          // the registry's own structural answer, so a snapshot is as authoritative as
          // `activate_tab`'s `res.split` and arrives on paths `onSelect` never runs on. Without
          // it a hot-reload `respawn_tabs` (remove + add → the tab comes back UNSPLIT) left
          // `splitById` stuck on `true`, rendering a divider and a permanently empty second pane
          // over a tab with no secondary, self-healing only on the next `onSelect` for that tab
          // — which never comes if that tab stays selected. `res.split` is now a fast path, not
          // the sole reconciler.
          if (t.split_layout) splitLayoutById.set(t.id, t.split_layout); else splitLayoutById.delete(t.id);
          // Cold everywhere (a respawn, a child exit, a fresh window) → the dragged ratio is gone.
          if (!t.spawned && !t.secondary_spawned && !t.detached) ratioOverride.delete(t.id);
          splitById.set(t.id, !!t.split);
        });
        evictSplits(ids); // Task 8: same sweep — drop persisted ratios for tabs that no longer exist
        return {
          title: dto.title,
          colour: dto.colour ?? null,
          density: dto.density || "comfortable",
          // sidebar_drag (global config, default on): make the non-interactive chrome a
          // window-move drag handle. Absent field defaults on, matching warden's default.
          windowDrag: dto.sidebar_drag !== false,
          tabs: dto.tabs.map((t) => ({
            id: t.id,
            title: t.title,
            group: t.group ?? null,
            // A [[window.root]] section: tree = true makes chrome-core render the group as a
            // collapsible folder tree, treePath = the folder segments between the root and the
            // project. Forwarded from warden's TabDto (serde renames tree_path → treePath).
            tree: !!t.tree,
            treePath: t.treePath || [],
            // This tab's surface has been popped out into its own window: chrome-core renders
            // the row with the ⤢ detached mark and the app treats a click on it as "raise that
            // window". Invisible until forwarded here (the "tree rendered flat" footgun class).
            detached: !!t.detached,
            live: t.spawned,
            attention: badges.has(t.id) ? true : null,
            // `t.presence` is already 'on'/'ghost'/'off' (or null = never probed) from the
            // backend PresenceCache; a live `session` entry from a probe emit wins over it.
            presence: t.has_probe ? (session.get(t.id) ?? t.presence ?? "off") : null,
            killable: !!t.has_kill,
            startable: !!t.has_cmd, // presence dot can restart a dead session by re-running `cmd`
            warn: !!t.warn,
          })),
        };
      }

      function applyDto(dto) {
        sb.update(toComponentDto(dto));
        // The window colour on the ROOT, for the pane focus ring (`.pane.focused` reads it —
        // the panes sit outside chrome-core's sidebar root, so its own tokens never reach them).
        // Hot-reload re-runs this, so a `colour` edit re-tints the ring with the banner.
        if (dto.colour) document.documentElement.style.setProperty("--accent", dto.colour);
        else document.documentElement.style.removeProperty("--accent");
        if (!dto.tabs.length) {
          setActiveId(null, false); // zero tabs → blank; the ≥1 case fires onSelect
        } else if (activeId !== null) {
          // A snapshot is authoritative about which tabs are spawned, so re-derive whether the hole
          // is covered (a hot-reload may have respawned or dropped the selected tab's surface).
          const t = dto.tabs.find((t) => t.id === activeId);
          setActiveId(activeId, !!(t && t.spawned));
        } else {
          // Tabs exist but nothing is selected yet — chrome-core's own onSelect will follow and
          // call setActiveId (which reports both holes itself). Fix round 1, cheap item 4:
          // `setActiveId` already calls `reportRect()` via `setSplitVisible`, so a trailing call
          // here would just repeat it on both branches above — kept only for this one case, where
          // neither branch ran.
          reportRect();
        }
      }

      // The chrome state after a tab went cold: row shows cold, and the highlight follows whichever
      // neighbour the native layer activated (none → blank hole + empty state). Shared by BOTH ways
      // a tab goes cold — the user unloading it (dot ✕ / ⌘W) and its process exiting on its own
      // (warden:tab-exited) — so the two can't drift into different-looking outcomes.
      function applyUnloaded(id, newActive) {
        // `unload` closes BOTH panes of `id` (Registry::unload acts on every pane), so its
        // secondary is cold too. The stale direction that matters is stale-TRUE: leaving the old
        // entry would make re-selecting this tab later derive secondaryLive = true over a pane
        // that's actually dead (fix round 1, IMPORTANT 3) — the reverse, stale-false, is
        // harmless (a backstop painted under a live surface is simply invisible).
        secondarySpawnedById.set(id, false);
        ratioOverride.delete(id);
        sb.setLive(id, false);
        if (newActive) {
          sb.setActive(newActive);
          badges.delete(newActive);
          sb.setAttention(newActive, null); // now visible → clear its badge
          setActiveId(newActive, true); // pick_live_neighbour only returns already-spawned tabs
        } else if (id === activeId) {
          // The tab we were looking at went cold and nothing live remains → blank hole.
          sb.setActive(null);
          setActiveId(null, false);
        }
        // else: a BACKGROUND tab went cold. `unload` only names a new active tab when the tab it
        // unloaded was the active one, so a null here means either "nothing live left" (above) or
        // "selection was never involved" — and blanking on the latter would drop the highlight off
        // the tab the user is still using. Leave the selection alone.
        reportRect();
      }

      // Unload a tab (dot ✕ or ⌘W): kill its surface+PTY → cold; the native layer activates a
      // neighbour and returns its id so the highlight follows; killing the last tab leaves a blank.
      async function unloadTab(id) {
        let newActive;
        try {
          newActive = await invoke("unload_tab", { id });
        } catch (err) {
          console.error("warden: unload_tab failed", err); // PTY state unknown — leave the row as-is
          return;
        }
        applyUnloaded(id, newActive);
      }

      // ⌘D / Tab ▸ Split: give the active tab a second pane. Optimistic — `Registry::split` always
      // succeeds in creating the secondary entry (Task 3), so the layout shows immediately (its
      // own empty-state backstop covers it until `activate` finishes spawning) and `splitById` is
      // recorded as the authoritative answer right away, not left to a later refresh.
      //
      // Fix round 1, cheap item 2: on a genuine `split_pane` failure — reachable only when the
      // WINDOW itself wasn't found (see the Rust doc comment on `split_pane`'s early `?` — the
      // "could not open the second pane" arm still means `Registry::split` ran, so the secondary
      // genuinely exists there) — NOTHING was actually created server-side, so the optimistic
      // split above must be undone: without this, nothing would ever run `collapseSplit` (there
      // is no secondary whose exit could), leaving the layout stuck split until an unrelated tab
      // switch happened to reset it.
      async function splitActiveTab() {
        if (!activeId) return;
        const id = activeId;
        // Task 8 fix round 1, IMPORTANT 1: read the PREVIOUS split state before overwriting it.
        // The Rust side tolerates a stray second ⌘D on an already-split tab as a normal no-op —
        // this persistence must extend that tolerance, not break it. Without this guard, a
        // redundant ⌘D on a tab the user had already dragged to a custom ratio silently
        // overwrote the persisted ratio with 0.5, with no visible symptom until the NEXT
        // restart, when the split reopened flattened.
        const alreadySplit = splitById.get(id) === true;
        splitById.set(id, true);
        // Task 8: key presence IS the split flag (see saveSplit) — persist immediately rather
        // than only once the divider is dragged, so an un-dragged 50/50 split still survives a
        // restart. Undone by collapseSplit's clearSplit below if split_pane actually fails.
        // Only seed the default for a genuinely NEW split — see the guard above. A config-split
        // tab already has a declared ratio; saving 0.5 here would wrongly override it.
        if (!alreadySplit && !splitLayoutById.has(id)) saveSplit(id, 0.5);
        setSplitVisible(true);
        try {
          await invoke("split_pane", { id });
        } catch (err) {
          console.error("warden: IPC split_pane failed", err);
          if (sb) sb.setError("⚠ " + err);
          collapseSplit(id);
        }
      }

      // A pane mousedown (Step 3): point the tab's keyboard focus at it. Optimistic paint — the
      // click already tells us where the user wants to type — corrected back to primary only if
      // the backend refuses (e.g. the pane closed between the click and this call landing).
      async function focusPane(pane) {
        if (!activeId) return;
        const id = activeId;
        focusedPaneById.set(id, pane);
        updateFocusMarker();
        const ok = await invoke("focus_pane", { id, pane }).catch((err) => {
          console.error("warden: IPC focus_pane failed", err);
          return false;
        });
        if (!ok) {
          // Fix round 1, cheap item 3: reset the MIRROR unconditionally — if the user switched to
          // a different tab before this refusal landed, `id`'s own entry must still correct itself
          // (it's still wrong for a later re-select of `id`), even though there's no visible
          // marker to repaint for it right now. Only the REPAINT is gated on `id` still being the
          // one on screen.
          focusedPaneById.set(id, 0);
          if (id === activeId) updateFocusMarker();
        }
      }

      async function init() {
        let dto;
        try {
          dto = await invoke("init_tabs");
        } catch (err) {
          console.error("warden: init_tabs failed", err);
          if (sb) sb.setError("⚠ failed to load window: " + err);
          return;
        }
        if (!dto) return; // no managed window for this label yet (race: init_tabs ran before this window's WindowState was inserted)
        myLabel = dto.label;

        sb = window.ChromeSidebar.mount(
          document.getElementById("sidebar"),
          {
            async onSelect(id) {
              // A popped-out tab has no local surface to activate — "select" means "raise its
              // window". Don't change local selection (leave activeId on whatever's in this hole).
              if (detached.has(id)) {
                invokeSafe("raise_popped_window", { id });
                return;
              }
              // Focusing a tab clears its unread badge (it's now visible).
              badges.delete(id);
              sb.setAttention(id, null);
              setActiveId(id, false); // not known live until the spawn returns; already reports
                                       // both holes via setSplitVisible (fix round 1, cheap item 4)
              // activate_tab reports whether a surface now covers the hole, PLUS (Task 7) this
              // tab's own split/focused layout — the authoritative answer `setActiveId`'s third
              // arg exists for (see its own doc comment): this is the ONE place a tab switch's
              // preserved focus (Registry::activate's untestable branch) is ever confirmed.
              const res = await invoke("activate_tab", { id }).catch((err) => {
                console.error("warden: IPC activate_tab failed", err);
                return { live: false, split: false, focused: 0 };
              });
              if (activeId === id) {
                // A RUNTIME (⌘D) split is not in the TOML, so the backend has no memory of it
                // across a restart — only localStorage remembers it. `res.split` is the
                // backend's authoritative CURRENT answer; when it says no but a ratio is on
                // record for a tab with no config split, recreate the split structurally. (A
                // config split needs no restore: `Registry::add` declares it from `TabSpec.split`.)
                //
                // Fix round 1, IMPORTANT 2: bookkeeping (`splitById`, `res.split`) lands for
                // `id` UNCONDITIONALLY — even if the user has switched to a different tab while
                // split_pane was in flight — because `res.split` staying false forever otherwise
                // means the tab's split itself is lost, not just its ratio: the backend really
                // does have it, but the `!res.split` gate below would never fire for this tab
                // again this session, so this is the only chance to record it. Only the DOM
                // write (further down, gated on `activeId === id` again) is unsafe to do for a
                // tab that isn't on screen — #pane-primary/#pane-secondary are the one shared
                // element pair every tab's layout reuses.
                const persisted = loadSplit(id);
                // A config split the backend says is closed had its shell exit on purpose and holds
                // closed until relaunch — never re-split it from here.
                if (!res.split && persisted && !splitLayoutById.has(id)) {
                  try {
                    await invoke("split_pane", { id });
                    splitById.set(id, true);
                    res.split = true;
                  } catch (err) {
                    console.error("warden: IPC split_pane (restore) failed", err);
                    clearSplit(id);
                  }
                }
                if (activeId === id) {
                  // Re-apply the persisted ratio on EVERY activation that ends up split, not
                  // just a freshly-restored one: the shared pane elements keep whatever flex the
                  // last split tab shown left them at, so a tab reactivated after the race above
                  // (or simply after another split tab's own drag) needs repainting too. Ahead
                  // of setActiveId so it's correct on the first reportRect, never a 50/50 flash.
                  focusedPaneById.set(id, res.focused);
                  setActiveId(id, res.live, res.split); // ignore a stale reply for an old click
                  // Repaint the row's live/cold dot now the spawn has settled. setActiveId only
                  // tracks selection + the empty-state; without this an unloaded tab that a cold
                  // start just brought live keeps showing a hollow (cold) dot until the next full
                  // refresh (the "cold-start indicator never lights up" bug).
                  sb.setLive(id, res.live);
                }
              }
            },
            onUnload: unloadTab,
            onPopOut(id) {
              // Pop the tab out into its own window (preserving the live terminal). The backend
              // detaches the surface, opens a detached window, reparents into it, and pushes a
              // refresh so this row re-renders detached. chrome-core only offers this control on a
              // not-already-detached tab.
              invokeSafe("pop_out_tab", { id, ratio: popOutRatio(id) });
            },
            onPopIn(id) {
              // Dock a popped-out tab back in (the ↩ overlay on a detached row's tile). Closing
              // the detached window fires its Destroyed handler → redock → the tab returns here.
              invokeSafe("pop_in_tab", { id });
            },
            onKill(id) {
              // No optimistic drop: the presence dot tracks `warden:session-state` only. kill_session
              // runs the kill then bumps the scheduler's fast burst, which converges the dot
              // monotonically (lit ~0.4–1s during teardown, then drops once — no off→on→off flicker).
              // A failed kill leaves the session present, so the dot correctly stays lit.
              invokeSafe("kill_session", { id });
            },
            onKillClose(id) {
              // ☠ = kill the session AND take the tab cold, in one action. Race-free in either
              // order and needs no backend command: `kill_target` reads the tab's *spec*, not its
              // slot, so a cold tab still kills; and the kill runs on a detached warden-app thread,
              // never as a child of this tab's shell, so tearing down the PTY can't cancel it.
              invokeSafe("kill_session", { id });
              unloadTab(id); // shared path with ⌘W / the ✕ dot — same cold state, same highlight follow
            },
            onStart(id) {
              // Restart a dead session: warden re-types the tab's `cmd` into the live shell, then
              // bumps the scheduler so the cyan dot lights once it's up. No optimistic paint — wait for truth.
              invokeSafe("start_session", { id });
            },
            onResize(width) {
              document.getElementById("sidebar").style.width = width + "px";
              reportRect();
            },
            onRescan() {
              // Refresh control on a [[window.root]] section header: re-scan the
              // window's roots so projects added/removed on disk appear/vanish.
              // The component passes the group name; the backend rescans the whole
              // config, so it's ignored here (forward-compat).
              invokeSafe("rescan_root");
            },
          },
          {
            appName: "warden",
            storageKey: "warden:sidebar-width:" + myLabel,
            defaultWidth: sidebarDefault(),
            minWidth: 120,
            maxWidth: 400,
            maxFraction: 0.4,
            // chrome-core's self-updater gate: run the launch + 6h checks when warden's config allows.
            autoUpdate: dto.auto_update !== false,
          }
        );

        applyDto(dto);
        if (dto.error) sb.setError("⚠ " + dto.error); // a launch-time spawn failure rode in on init

        // (The launch + 6h update checks are armed by chrome-core from the `autoUpdate` mount config.)

        // Ask for the first probe pass only AFTER the session-state listener is registered, so the
        // first emit can't race ahead of it. This populates the presence dots at startup.
        try { await sessionListenReady; } catch (e) { /* listener still works */ }
        invokeSafe("probe_now");
      }

      // Density-aware default sidebar width, read from chrome-core's `--cc-sidebar-w` token (240
      // comfortable / 200 compact); the component's double-click reset uses this too.
      function sidebarDefault() {
        const v = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--cc-sidebar-w"), 10);
        return Number.isFinite(v) ? v : 240;
      }

      // Hot-reload: the manager pushes a fresh snapshot after a reconcile. Drop a malformed payload
      // or one addressed to a sibling window. Listeners are registered at script-eval time but `sb`
      // only exists after init()'s awaits, so every one of them must tolerate a pre-init event —
      // dropping it is safe (init() pulls a fresh init_dto and replays presence via probe_now).
      listen("warden:refresh", (e) => {
        const p = e.payload;
        if (!p || !Array.isArray(p.tabs) || !sb) return;
        if (myLabel && p.label && p.label !== myLabel) return;
        applyDto(p);
      });

      // A tab's process exited on its own (shell exited, agent quit, command finished). The native
      // layer has already unloaded it to cold and picked any new active tab — apply the same chrome
      // tail as a manual unload. emit_to leaks to sibling windows → forMe filter.
      listen("warden:tab-exited", (e) => {
        if (!forMe(e)) return;
        const p = e.payload;
        if (!p || !p.id || !sb) return;
        applyUnloaded(p.id, p.newActive || null);
      });

      // Config error banner (parse error / no-window) — now sidebar-scoped via the component. A
      // per-tab spawn error is {label,message} (own window only); a global config error is a bare
      // string shown everywhere.
      listen("warden:error", (e) => {
        const p = e.payload;
        if (p && typeof p === "object" && p.label && myLabel && p.label !== myLabel) return;
        const msg = p && typeof p === "object" ? p.message : p;
        if (sb) sb.setError("⚠ " + msg);
      });
      listen("warden:error-clear", () => { if (sb) sb.clearError(); });
      // Menu "Check for Updates…" → chrome-core checks now + announces (up-to-date / error / banner).
      // emit_to leaks → forMe filter, else one menu click checks in every open window.
      listen("warden:check-update", (e) => {
        if (!forMe(e) || !sb) return;
        sb.checkForUpdateNow();
      });

      // Menu tab nav: cycle ONLY loaded tabs (⌘⇧[/]) and jump (⌘1–9). emit_to leaks → forMe filter.
      listen("warden:cycle-tab", (e) => {
        if (!forMe(e) || !sb) return;
        sb.selectByOffset(e.payload.dir, { liveOnly: true });
      });
      listen("warden:select-tab", (e) => {
        if (!forMe(e) || !sb) return;
        sb.selectByIndex(e.payload.n);
      });
      // ⌘W unloads the active tab (same as clicking its live dot).
      listen("warden:unload-tab", (e) => {
        if (!forMe(e)) return;
        if (activeId) unloadTab(activeId);
      });
      // ⌘⇧O pops the active tab out into its own window (same as its ⤢ pop-out control). Skip a
      // tab that's already detached (its window is elsewhere — nothing to pop out).
      listen("warden:pop-out-tab", (e) => {
        if (!forMe(e)) return;
        if (activeId && !detached.has(activeId)) invokeSafe("pop_out_tab", { id: activeId, ratio: popOutRatio(activeId) });
      });

      // A background tab raised a bell / OSC 9/777 while hidden — badge it (unless it's visible).
      listen("warden:notify", (e) => {
        if (!forMe(e) || !sb) return;
        const id = e.payload && e.payload.id;
        if (id && id !== activeId) {
          badges.add(id);
          sb.setAttention(id, true);
        }
      });
      // A desktop-notification banner was clicked — the native layer raised this window; select the
      // tab that fired it (which activates it + clears its badge via onSelect).
      listen("warden:focus-tab", (e) => {
        if (!forMe(e) || !sb) return;
        const id = e.payload && e.payload.id;
        if (id) sb.select(id);
      });
      // Probe results: light/clear the cyan presence dot per tab. Resolves once the backend has
      // registered this listener, so init() can await it before the first probe_now.
      const sessionListenReady = listen("warden:session-state", (e) => {
        if (!forMe(e) || !sb) return;
        for (const [id, state] of Object.entries(e.payload?.states || {})) {
          session.set(id, state);
          sb.setPresence(id, state);
        }
      });

      // The terminal surfaces track their holes: re-report on any layout change, and re-clamp the
      // sidebar on window resize (a shrunk window must pull an over-wide sidebar back in). Observes
      // both panes, not #terminal-hole itself — un-hiding #pane-secondary (a split) changes ITS box
      // without necessarily changing the hole's, and that's exactly the transition that must
      // re-report both holes (see reportRect).
      const ro = new ResizeObserver(() => reportRect());
      ro.observe(document.getElementById("pane-primary"));
      ro.observe(document.getElementById("pane-secondary"));

      // Divider drag-to-resize: chrome owns split geometry — Rust never sees a ratio, only the
      // rects reportRect derives from these panes' live flex-basis. Same mousedown→mousemove→mouseup
      // shape as chrome-core's sidebar resize handle (ui/chrome-core.js's `_initResize`), including
      // the same fix for the same footgun: the terminal NSView composites ABOVE this webview, so a
      // mouseup released over either pane's live surface never reaches this window at all — onMove
      // unsticks itself the instant `e.buttons` reads 0 rather than trusting `mouseup` to fire.
      //
      // DELTA-based, like `_initResize`'s own `startW + (e.clientX - startX)` — not an absolute
      // `(clientX - hole.x) / usable` mapping. Fix round 1's cheap fix #1: an absolute mapping
      // snaps the boundary to wherever in the 6px strip the pointer happened to land the instant
      // you grab it, a visible jump on every drag start. Tracking the fraction *at grab* and
      // applying only the pointer's MOVEMENT since then means the boundary starts exactly where
      // it already was, regardless of where within the divider you clicked.
      (function () {
        const divider = document.getElementById("pane-divider");
        const primaryEl = document.getElementById("pane-primary");
        let dragging = false;
        let startX = 0;
        let startFrac = 0.5;
        let currentFrac = 0.5; // last-applied ratio; saved to localStorage when the drag ends (Task 8)
        // Task 8 fix round 1, CHEAP: the tab being dragged, captured at mousedown — mouse and
        // keyboard are independent, so reading `activeId` live at mouseup would save the dragged
        // ratio under whichever tab a keyboard jump made active while the button was still held,
        // fabricating a persisted split key for a tab the user never split.
        let dragTabId = null;
        function setSplit(frac) {
          currentFrac = applySplitFlex(frac); // shared clamp/apply with split restoration
          reportRect();
        }
        function usableWidth() {
          const hole = document.getElementById("terminal-hole").getBoundingClientRect();
          const dividerW = divider.getBoundingClientRect().width;
          return hole.width - dividerW;
        }
        function onMove(e) {
          if (!dragging) return;
          if (e.buttons === 0) { end(); return; }
          const usable = usableWidth();
          // The primary is on the RIGHT under `.secondary-left`, so pointer movement to the
          // right shrinks it.
          const sign = document.getElementById("terminal-hole").classList.contains("secondary-left") ? -1 : 1;
          if (usable > 0) setSplit(startFrac + sign * (e.clientX - startX) / usable);
        }
        function end() {
          if (!dragging) return;
          dragging = false;
          document.body.style.cursor = "";
          window.removeEventListener("mousemove", onMove);
          window.removeEventListener("mouseup", end);
          window.removeEventListener("blur", end);
          // Task 8: persist whatever ratio the drag settled on. A click-without-move still saves
          // the split's actual (unchanged) ratio, since currentFrac was seeded from startFrac.
          // Saved under `dragTabId` (captured at mousedown), not the live `activeId` — see that
          // declaration.
          if (dragTabId !== null) saveSplit(dragTabId, currentFrac);
          dragTabId = null;
        }
        divider.addEventListener("mousedown", (e) => {
          e.preventDefault();
          const usable = usableWidth();
          const p = primaryEl.getBoundingClientRect();
          startFrac = usable > 0 ? p.width / usable : 0.5; // the CURRENT split, not a reset to 50/50
          currentFrac = startFrac;
          dragTabId = activeId;
          startX = e.clientX;
          dragging = true;
          document.body.style.cursor = "col-resize";
          window.addEventListener("mousemove", onMove);
          window.addEventListener("mouseup", end);
          window.addEventListener("blur", end);
        });
      })();

      // Clicking a pane moves keyboard focus to it. Two routes, one registry record:
      //  - a COLD pane has only its backstop on top, so the click reaches this DOM listener →
      //    `focusPane` → the `focus_pane` command (bound on the pane elements themselves, since
      //    the backstops sit inside them);
      //  - a LIVE pane's terminal content is a native NSView composited ABOVE this webview, which
      //    consumes the click before the DOM sees it — that route arrives instead as
      //    `warden:pane-focused` (below), raised from the view's own `becomeFirstResponder`.
      document.getElementById("pane-primary").addEventListener("mousedown", () => focusPane(0));
      document.getElementById("pane-secondary").addEventListener("mousedown", () => focusPane(1));

      // A pane became first responder natively — a click on live terminal content, or activate's
      // own re-focus on a tab switch. The backend has already moved `Registry.focused`; mirror it
      // so the marker follows. Bookkeeping lands for the id unconditionally (a later re-select
      // reads it); only the repaint is gated on that tab being the one on screen.
      listen("warden:pane-focused", (e) => {
        if (!forMe(e)) return;
        const p = e.payload;
        if (!p || !p.id) return;
        focusedPaneById.set(p.id, p.pane === 1 ? 1 : 0);
        if (p.id === activeId) updateFocusMarker();
      });

      // Tab ▸ Split (⌘D). emit_to leaks → forMe filter, same as every other menu-routed event.
      listen("warden:split-pane", (e) => {
        if (!forMe(e)) return;
        splitActiveTab();
      });

      // A split's secondary process exited — the one way a split ends — collapse the layout
      // without touching the tab's own dot/highlight (unlike `warden:tab-exited`).
      listen("warden:pane-closed", (e) => {
        if (!forMe(e)) return;
        const p = e.payload;
        if (!p || !p.id) return;
        collapseSplit(p.id);
      });

      window.addEventListener("resize", () => {
        const sidebar = document.getElementById("sidebar");
        const cur = parseInt(getComputedStyle(sidebar).width, 10);
        if (Number.isFinite(cur)) {
          const max = Math.min(400, window.innerWidth * 0.4);
          sidebar.style.width = Math.max(120, Math.min(cur, max)) + "px";
        }
        reportRect();
      });

      window.addEventListener("load", init);
    </script>
  </body>
</html>
