<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>warden</title>
    <link rel="stylesheet" href="chrome-core.css" />
    <style>
      /* Page shell only — the sidebar interior (banner, rows, dots, kill-confirm, error bar, resize)
         lives in chrome-core. This keeps warden's window topology: a native libghostty surface
         composited ABOVE the webview shows through #terminal-hole, so the sidebar is a normal DOM
         column beside a transparent hole. The window is transparent → every painted surface here
         must stay OPAQUE or it leaks the wallpaper. */
      html, body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #app { height: 100%; display: flex; flex-direction: row; }
      /* The chrome-core mount container. chrome-core's own `#cc-titlebar` strip (the `appName`
         mount config) now owns the traffic-light inset — no page-level padding-top here; chrome-core
         adds `.cc-root` (opaque flex column). Width is the density-aware token, overridden inline by
         the resize controller. */
      #sidebar { width: var(--cc-sidebar-w, 240px); flex: none; }
      #terminal-hole { flex: 1; background: transparent; position: relative; }
      /* Empty-state placeholder (warden's shield mark) — shown by the controller whenever no LIVE
         surface covers the hole (no tab selected, or the selected tab is cold), composited BEHIND
         the native surface (so a live tab occludes it). OPAQUE. */
      #empty-state {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: #0e1516;
        user-select: none;
        -webkit-user-select: none;
      }
      #empty-state svg { width: 160px; height: auto; opacity: 0.9; }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- chrome-core mounts here (adds .cc-root + banner/rows/resize), including its own
           `#cc-titlebar` strip (the `appName` mount config) over the traffic-light zone; the
           sidebar BODY drag is stamped by chrome-core per the `windowDrag` DTO flag (from
           `sidebar_drag`). -->
      <aside id="sidebar" data-tauri-drag-region></aside>
      <div id="terminal-hole">
        <div id="empty-state">
          <svg viewBox="108 52 296 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="no tab selected">
            <path d="M 152 72 L 360 72 Q 384 72 384 96 L 384 256 C 384 360 330 412 256 452 C 182 412 128 360 128 256 L 128 96 Q 128 72 152 72 Z"
                  fill="#283034"/>
            <g fill="none" stroke="#5c676c" stroke-linecap="round" stroke-linejoin="round">
              <path d="M 186 126 L 270 230 L 186 334" stroke-width="18" opacity="0.3"/>
              <path d="M 208 152 L 270 230 L 208 308" stroke-width="20" opacity="0.55"/>
              <path d="M 230 178 L 270 230 L 230 282" stroke-width="26" opacity="1"/>
            </g>
            <rect x="296" y="210" width="34" height="40" rx="7" fill="#5c676c"/>
          </svg>
        </div>
      </div>
    </div>
    <script src="chrome-core.js"></script>
    <script>
      // warden's chrome controller: binds chrome-core's ChromeSidebar (the view) to warden's Tauri
      // backend + libghostty native surface. The sidebar rendering lives in chrome-core; this maps
      // callbacks→commands and events→setters, and keeps warden's content-area plumbing: the
      // native-surface hole geometry (reportRect), the empty-state placeholder, per-window event
      // filtering (forMe), and the first-probe handshake.
      const { invoke } = window.__TAURI__.core;
      const { listen } = window.__TAURI__.event;

      function invokeSafe(cmd, args) {
        return invoke(cmd, args).catch((err) => console.error("warden: IPC " + cmd + " failed", err));
      }

      let myLabel = null; // this window's Tauri label — emit_to leaks to siblings, so filter on it
      let sb = null;
      let activeId = null; // controller mirror of the active tab, for the empty-state placeholder
      let activeLive = false; // …and whether a live surface actually covers the hole for it
      const badges = new Set(); // tab ids with an unread notification/bell badge
      const detached = new Set(); // tab ids popped out into their own window (onSelect → raise it)
      // tab id → 'on' | 'ghost' | 'off' (probe presence), for probe-enabled tabs. The backend
      // sends these strings verbatim (they ARE chrome-core's wire values) — do not re-derive
      // them from a boolean; presence has been 3-state since exit 3 ("recoverable") shipped.
      const session = new Map();

      // In-app updates are a chrome-core capability (check / install / relaunch + the 6h re-check
      // cadence); see chrome-core's dividing-line decision. This controller only passes warden's
      // `auto_update` gate (below, `autoUpdate` in the mount config) and forwards the menu event to
      // sb.checkForUpdateNow(). warden keeps its own updater *identity* — endpoint, pubkey, plugin
      // registration — in tauri.conf.json / Rust.

      const forMe = (e) => !(e.payload && e.payload.label && myLabel && e.payload.label !== myLabel);

      // Report the terminal-hole's CSS rect to the native layer so the libghostty surface tracks it.
      function reportRect() {
        const r = document.getElementById("terminal-hole").getBoundingClientRect();
        invokeSafe("set_hole_rect", { rect: { x: r.x, y: r.y, width: r.width, height: r.height } });
      }

      // The empty-state is the opaque backstop for an UNCOVERED hole. The window is transparent and
      // the terminal NSView composites above the webview, so the hole is filled only while a *live*
      // surface sits in it — and "a tab is selected" is not the same thing: a tab whose lazy spawn
      // failed stays selected but cold, and keying on selection alone left that hole uncovered,
      // leaking the wallpaper (the very leak this element exists to stop). So key on liveness of the
      // selected tab: no selection, or a selected-but-cold tab → paint it.
      function paintEmptyState() {
        const covered = activeId !== null && activeLive;
        document.getElementById("empty-state").style.display = covered ? "none" : "flex";
      }
      // `live` = does a surface cover the hole for this tab? Callers that can't know yet (a click,
      // before the spawn returns) pass false; the placeholder they briefly paint is invisible anyway
      // (any live surface composites over it), so an honest false never flickers.
      function setActiveId(id, live) {
        activeId = id;
        activeLive = !!live;
        paintEmptyState();
      }

      // Map a warden window snapshot → chrome-core's DTO. Attention (notify) + presence (probe) are
      // chrome-side state (Sets/Map), folded in here so a full update() restores them; killable +
      // warn come from the snapshot. No `active` field — warden is component-authoritative (the
      // component preserves selection + falls back to the first tab, firing onSelect to activate it).
      function toComponentDto(dto) {
        const ids = new Set(dto.tabs.map((t) => t.id));
        badges.forEach((id) => { if (!ids.has(id)) badges.delete(id); });
        session.forEach((_, id) => { if (!ids.has(id)) session.delete(id); });
        // Rebuild the detached-id set from the snapshot (authoritative), so onSelect can route a
        // click on a popped-out row to raise-its-window rather than activate a nonexistent surface.
        detached.clear();
        dto.tabs.forEach((t) => { if (t.detached) detached.add(t.id); });
        return {
          title: dto.title,
          colour: dto.colour ?? null,
          density: dto.density || "comfortable",
          // sidebar_drag (global config, default on): make the non-interactive chrome a
          // window-move drag handle. Absent field defaults on, matching warden's default.
          windowDrag: dto.sidebar_drag !== false,
          tabs: dto.tabs.map((t) => ({
            id: t.id,
            title: t.title,
            group: t.group ?? null,
            // A [[window.root]] section: tree = true makes chrome-core render the group as a
            // collapsible folder tree, treePath = the folder segments between the root and the
            // project. Forwarded from warden's TabDto (serde renames tree_path → treePath).
            tree: !!t.tree,
            treePath: t.treePath || [],
            // This tab's surface has been popped out into its own window: chrome-core renders
            // the row with the ⤢ detached mark and the app treats a click on it as "raise that
            // window". Invisible until forwarded here (the "tree rendered flat" footgun class).
            detached: !!t.detached,
            live: t.spawned,
            attention: badges.has(t.id) ? true : null,
            // `t.presence` is already 'on'/'ghost'/'off' (or null = never probed) from the
            // backend PresenceCache; a live `session` entry from a probe emit wins over it.
            presence: t.has_probe ? (session.get(t.id) ?? t.presence ?? "off") : null,
            killable: !!t.has_kill,
            startable: !!t.has_cmd, // presence dot can restart a dead session by re-running `cmd`
            warn: !!t.warn,
          })),
        };
      }

      function applyDto(dto) {
        sb.update(toComponentDto(dto));
        if (!dto.tabs.length) {
          setActiveId(null, false); // zero tabs → blank; the ≥1 case fires onSelect
        } else if (activeId !== null) {
          // A snapshot is authoritative about which tabs are spawned, so re-derive whether the hole
          // is covered (a hot-reload may have respawned or dropped the selected tab's surface).
          const t = dto.tabs.find((t) => t.id === activeId);
          setActiveId(activeId, !!(t && t.spawned));
        }
        reportRect();
      }

      // The chrome state after a tab went cold: row shows cold, and the highlight follows whichever
      // neighbour the native layer activated (none → blank hole + empty state). Shared by BOTH ways
      // a tab goes cold — the user unloading it (dot ✕ / ⌘W) and its process exiting on its own
      // (warden:tab-exited) — so the two can't drift into different-looking outcomes.
      function applyUnloaded(id, newActive) {
        sb.setLive(id, false);
        if (newActive) {
          sb.setActive(newActive);
          badges.delete(newActive);
          sb.setAttention(newActive, null); // now visible → clear its badge
          setActiveId(newActive, true); // pick_live_neighbour only returns already-spawned tabs
        } else if (id === activeId) {
          // The tab we were looking at went cold and nothing live remains → blank hole.
          sb.setActive(null);
          setActiveId(null, false);
        }
        // else: a BACKGROUND tab went cold. `unload` only names a new active tab when the tab it
        // unloaded was the active one, so a null here means either "nothing live left" (above) or
        // "selection was never involved" — and blanking on the latter would drop the highlight off
        // the tab the user is still using. Leave the selection alone.
        reportRect();
      }

      // Unload a tab (dot ✕ or ⌘W): kill its surface+PTY → cold; the native layer activates a
      // neighbour and returns its id so the highlight follows; killing the last tab leaves a blank.
      async function unloadTab(id) {
        let newActive;
        try {
          newActive = await invoke("unload_tab", { id });
        } catch (err) {
          console.error("warden: unload_tab failed", err); // PTY state unknown — leave the row as-is
          return;
        }
        applyUnloaded(id, newActive);
      }

      async function init() {
        let dto;
        try {
          dto = await invoke("init_tabs");
        } catch (err) {
          console.error("warden: init_tabs failed", err);
          if (sb) sb.setError("⚠ failed to load window: " + err);
          return;
        }
        if (!dto) return; // no managed window for this label yet (race: init_tabs ran before this window's WindowState was inserted)
        myLabel = dto.label;

        sb = window.ChromeSidebar.mount(
          document.getElementById("sidebar"),
          {
            async onSelect(id) {
              // A popped-out tab has no local surface to activate — "select" means "raise its
              // window". Don't change local selection (leave activeId on whatever's in this hole).
              if (detached.has(id)) {
                invokeSafe("raise_popped_window", { id });
                return;
              }
              // Focusing a tab clears its unread badge (it's now visible).
              badges.delete(id);
              sb.setAttention(id, null);
              setActiveId(id, false); // not known live until the spawn returns
              reportRect();
              // activate_tab reports whether a surface now covers the hole. A lazy spawn CAN fail
              // (bad dir/shell, and a cold tab is exactly what a dead tab respawns from), leaving
              // the tab selected but cold — the placeholder must cover that hole, not the wallpaper.
              const live = await invoke("activate_tab", { id }).catch((err) => {
                console.error("warden: IPC activate_tab failed", err);
                return false;
              });
              if (activeId === id) {
                setActiveId(id, live); // ignore a stale reply for an old click
                // Repaint the row's live/cold dot now the spawn has settled. setActiveId only
                // tracks selection + the empty-state; without this an unloaded tab that a cold
                // start just brought live keeps showing a hollow (cold) dot until the next full
                // refresh (the "cold-start indicator never lights up" bug).
                sb.setLive(id, live);
              }
            },
            onUnload: unloadTab,
            onPopOut(id) {
              // Pop the tab out into its own window (preserving the live terminal). The backend
              // detaches the surface, opens a detached window, reparents into it, and pushes a
              // refresh so this row re-renders detached. chrome-core only offers this control on a
              // not-already-detached tab.
              invokeSafe("pop_out_tab", { id });
            },
            onPopIn(id) {
              // Dock a popped-out tab back in (the ↩ overlay on a detached row's tile). Closing
              // the detached window fires its Destroyed handler → redock → the tab returns here.
              invokeSafe("pop_in_tab", { id });
            },
            onKill(id) {
              // No optimistic drop: the presence dot tracks `warden:session-state` only. kill_session
              // runs the kill then bumps the scheduler's fast burst, which converges the dot
              // monotonically (lit ~0.4–1s during teardown, then drops once — no off→on→off flicker).
              // A failed kill leaves the session present, so the dot correctly stays lit.
              invokeSafe("kill_session", { id });
            },
            onKillClose(id) {
              // ☠ = kill the session AND take the tab cold, in one action. Race-free in either
              // order and needs no backend command: `kill_target` reads the tab's *spec*, not its
              // slot, so a cold tab still kills; and the kill runs on a detached warden-app thread,
              // never as a child of this tab's shell, so tearing down the PTY can't cancel it.
              invokeSafe("kill_session", { id });
              unloadTab(id); // shared path with ⌘W / the ✕ dot — same cold state, same highlight follow
            },
            onStart(id) {
              // Restart a dead session: warden re-types the tab's `cmd` into the live shell, then
              // bumps the scheduler so the cyan dot lights once it's up. No optimistic paint — wait for truth.
              invokeSafe("start_session", { id });
            },
            onResize(width) {
              document.getElementById("sidebar").style.width = width + "px";
              reportRect();
            },
            onRescan() {
              // Refresh control on a [[window.root]] section header: re-scan the
              // window's roots so projects added/removed on disk appear/vanish.
              // The component passes the group name; the backend rescans the whole
              // config, so it's ignored here (forward-compat).
              invokeSafe("rescan_root");
            },
          },
          {
            appName: "warden",
            storageKey: "warden:sidebar-width:" + myLabel,
            defaultWidth: sidebarDefault(),
            minWidth: 120,
            maxWidth: 400,
            maxFraction: 0.4,
            // chrome-core's self-updater gate: run the launch + 6h checks when warden's config allows.
            autoUpdate: dto.auto_update !== false,
          }
        );

        applyDto(dto);
        if (dto.error) sb.setError("⚠ " + dto.error); // a launch-time spawn failure rode in on init

        // (The launch + 6h update checks are armed by chrome-core from the `autoUpdate` mount config.)

        // Ask for the first probe pass only AFTER the session-state listener is registered, so the
        // first emit can't race ahead of it. This populates the presence dots at startup.
        try { await sessionListenReady; } catch (e) { /* listener still works */ }
        invokeSafe("probe_now");
      }

      // Density-aware default sidebar width, read from chrome-core's `--cc-sidebar-w` token (240
      // comfortable / 200 compact); the component's double-click reset uses this too.
      function sidebarDefault() {
        const v = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--cc-sidebar-w"), 10);
        return Number.isFinite(v) ? v : 240;
      }

      // Hot-reload: the manager pushes a fresh snapshot after a reconcile. Drop a malformed payload
      // or one addressed to a sibling window. Listeners are registered at script-eval time but `sb`
      // only exists after init()'s awaits, so every one of them must tolerate a pre-init event —
      // dropping it is safe (init() pulls a fresh init_dto and replays presence via probe_now).
      listen("warden:refresh", (e) => {
        const p = e.payload;
        if (!p || !Array.isArray(p.tabs) || !sb) return;
        if (myLabel && p.label && p.label !== myLabel) return;
        applyDto(p);
      });

      // A tab's process exited on its own (shell exited, agent quit, command finished). The native
      // layer has already unloaded it to cold and picked any new active tab — apply the same chrome
      // tail as a manual unload. emit_to leaks to sibling windows → forMe filter.
      listen("warden:tab-exited", (e) => {
        if (!forMe(e)) return;
        const p = e.payload;
        if (!p || !p.id || !sb) return;
        applyUnloaded(p.id, p.newActive || null);
      });

      // Config error banner (parse error / no-window) — now sidebar-scoped via the component. A
      // per-tab spawn error is {label,message} (own window only); a global config error is a bare
      // string shown everywhere.
      listen("warden:error", (e) => {
        const p = e.payload;
        if (p && typeof p === "object" && p.label && myLabel && p.label !== myLabel) return;
        const msg = p && typeof p === "object" ? p.message : p;
        if (sb) sb.setError("⚠ " + msg);
      });
      listen("warden:error-clear", () => { if (sb) sb.clearError(); });
      // Menu "Check for Updates…" → chrome-core checks now + announces (up-to-date / error / banner).
      // emit_to leaks → forMe filter, else one menu click checks in every open window.
      listen("warden:check-update", (e) => {
        if (!forMe(e) || !sb) return;
        sb.checkForUpdateNow();
      });

      // Menu tab nav: cycle ONLY loaded tabs (⌘⇧[/]) and jump (⌘1–9). emit_to leaks → forMe filter.
      listen("warden:cycle-tab", (e) => {
        if (!forMe(e) || !sb) return;
        sb.selectByOffset(e.payload.dir, { liveOnly: true });
      });
      listen("warden:select-tab", (e) => {
        if (!forMe(e) || !sb) return;
        sb.selectByIndex(e.payload.n);
      });
      // ⌘W unloads the active tab (same as clicking its live dot).
      listen("warden:unload-tab", (e) => {
        if (!forMe(e)) return;
        if (activeId) unloadTab(activeId);
      });
      // ⌘⇧O pops the active tab out into its own window (same as its ⤢ pop-out control). Skip a
      // tab that's already detached (its window is elsewhere — nothing to pop out).
      listen("warden:pop-out-tab", (e) => {
        if (!forMe(e)) return;
        if (activeId && !detached.has(activeId)) invokeSafe("pop_out_tab", { id: activeId });
      });

      // A background tab raised a bell / OSC 9/777 while hidden — badge it (unless it's visible).
      listen("warden:notify", (e) => {
        if (!forMe(e) || !sb) return;
        const id = e.payload && e.payload.id;
        if (id && id !== activeId) {
          badges.add(id);
          sb.setAttention(id, true);
        }
      });
      // A desktop-notification banner was clicked — the native layer raised this window; select the
      // tab that fired it (which activates it + clears its badge via onSelect).
      listen("warden:focus-tab", (e) => {
        if (!forMe(e) || !sb) return;
        const id = e.payload && e.payload.id;
        if (id) sb.select(id);
      });
      // Probe results: light/clear the cyan presence dot per tab. Resolves once the backend has
      // registered this listener, so init() can await it before the first probe_now.
      const sessionListenReady = listen("warden:session-state", (e) => {
        if (!forMe(e) || !sb) return;
        for (const [id, state] of Object.entries(e.payload?.states || {})) {
          session.set(id, state);
          sb.setPresence(id, state);
        }
      });

      // The terminal surface tracks the hole: re-report on any layout change, and re-clamp the
      // sidebar on window resize (a shrunk window must pull an over-wide sidebar back in).
      const ro = new ResizeObserver(() => reportRect());
      ro.observe(document.getElementById("terminal-hole"));
      window.addEventListener("resize", () => {
        const sidebar = document.getElementById("sidebar");
        const cur = parseInt(getComputedStyle(sidebar).width, 10);
        if (Number.isFinite(cur)) {
          const max = Math.min(400, window.innerWidth * 0.4);
          sidebar.style.width = Math.max(120, Math.min(cur, max)) + "px";
        }
        reportRect();
      });

      window.addEventListener("load", init);
    </script>
  </body>
</html>
