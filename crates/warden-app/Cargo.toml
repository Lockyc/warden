[package]
name = "warden-app"
version = "0.15.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# The shared sidebar chrome, embedded as string consts; build.rs writes them into ui/ (the
# frontendDist Tauri embeds). Pinned by rev — bump in lockstep with config-core + the toolchain.
chrome-core = { git = "https://github.com/Lockyc/chrome-core", rev = "8d0b79b8681309dd8d616ec5731808fb9ccc6dfd" }
# Shared release tooling + build_stamp. build.rs materializes scripts/*.sh (git-ignored) and stamps
# BUILD_GIT_SHA/BUILD_DATE. default-features=false keeps the build-dep zero-tauri (resolver 2 keeps
# it separate from the runtime-featured [dependencies] entry below). Pinned by rev.
shell-core = { git = "https://github.com/Lockyc/shell-core", rev = "95cf314bf5b6009943f413ad33f294602926f47a", default-features = false }

[dependencies]
# macos-private-api: required for programmatic transparent windows (the
# WebviewWindowBuilder::transparent method is gated behind it on macOS). Windows
# are created at runtime here, so config-side transparency no longer applies.
tauri = { version = "2", features = ["macos-private-api"] }
# In-app updates: check GitHub releases, download+verify (minisign), install and relaunch.
# updater/process are kept explicit so their capability permissions resolve, but plugin
# *registration* (including window geometry persistence) flows through shell_core::register_plugins
# (runtime feature) rather than the builder here.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Shared Tauri runtime helpers (register_plugins). runtime feature pulls tauri; the build-dep above
# stays zero-tauri. Same rev as the build-dep — bump both in lockstep.
shell-core = { git = "https://github.com/Lockyc/shell-core", rev = "95cf314bf5b6009943f413ad33f294602926f47a", features = ["runtime"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
warden-config = { path = "../warden-config" }
rex-client = { path = "../rex-client" }

[dev-dependencies]
tempfile = "3"
rex-client = { path = "../rex-client", features = ["fake"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
log = { version = "0.4", features = ["std"] }
# The unified-log handle behind `logging.rs`; its own `log` backend is replaced by ours.
oslog = { version = "0.2", default-features = false }
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSView", "NSWindow", "NSResponder", "NSEvent", "NSGraphics", "NSPasteboard", "NSApplication", "NSMenu", "NSImageRep", "NSBitmapImageRep", "NSCursor", "NSTrackingArea", "NSWorkspace", "NSScreen", "NSAlert", "NSButton", "NSControl", "NSTextField", "NSFont", "NSImage", "block2"] }
objc2-foundation = { version = "0.2", features = ["NSGeometry", "NSString", "NSThread", "NSData", "NSDictionary", "NSNotification", "NSURL", "NSArray", "NSError", "NSPathUtilities"] }
block2 = "0.5"
