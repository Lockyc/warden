[package]
name = "warden-app"
version = "0.7.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# The shared sidebar chrome, embedded as string consts; build.rs writes them into ui/ (the
# frontendDist Tauri embeds). Pinned by rev — bump in lockstep with config-core + the toolchain.
chrome-core = { git = "https://github.com/Lockyc/chrome-core", rev = "e64875449f9cc9090306c73a3711922e56c9318f" }
# Shared release tooling + build_stamp. build.rs materializes scripts/*.sh (git-ignored) and stamps
# BUILD_GIT_SHA/BUILD_DATE. default-features=false keeps the build-dep zero-tauri (resolver 2 keeps
# it separate from the runtime-featured [dependencies] entry below). Pinned by rev.
shell-core = { git = "https://github.com/Lockyc/shell-core", rev = "17f27b3b95d41188a90a6f48b7a094484c1c975a", default-features = false }

[dependencies]
# macos-private-api: required for programmatic transparent windows (the
# WebviewWindowBuilder::transparent method is gated behind it on macOS). Windows
# are created at runtime here, so config-side transparency no longer applies.
tauri = { version = "2", features = ["macos-private-api"] }
# Persist each window's size + position across launches, keyed by Tauri label.
tauri-plugin-window-state = "2"
# In-app updates: check GitHub releases, download+verify (minisign), install and relaunch.
# window-state is used directly (WindowExt::restore_state in manager.rs); updater/process are kept
# explicit so their capability permissions resolve, but plugin *registration* now flows through
# shell_core::register_plugins (runtime feature) rather than the builder here.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Shared Tauri runtime helpers (register_plugins). runtime feature pulls tauri; the build-dep above
# stays zero-tauri. Same rev as the build-dep — bump both in lockstep.
shell-core = { git = "https://github.com/Lockyc/shell-core", rev = "17f27b3b95d41188a90a6f48b7a094484c1c975a", features = ["runtime"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
warden-config = { path = "../warden-config" }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSView", "NSWindow", "NSResponder", "NSEvent", "NSGraphics", "NSPasteboard", "NSApplication", "NSMenu", "NSImageRep", "NSBitmapImageRep", "NSCursor", "NSTrackingArea", "NSWorkspace", "NSScreen"] }
objc2-foundation = { version = "0.2", features = ["NSGeometry", "NSString", "NSThread", "NSData", "NSDictionary", "NSNotification", "NSURL"] }
# Native macOS banners for terminal OSC 9/777 (see src/notify.rs). Replaces the
# tauri-plugin-notification backend, whose notify-rust/NSUserNotification path is
# a silent no-op on macOS 26. block2 is for the authorization completion handler.
block2 = "0.5"
objc2-user-notifications = { version = "0.2", features = ["UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationTrigger", "block2"] }
