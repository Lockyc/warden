# warden config — one window per project group, one tab per terminal. Edit and save; warden
# hot-reloads.

[[window]]
  title = "Terminal"

  # A tab is a terminal opened in `dir`, running `shell`. `cmd` (optional) is auto-run *inside*
  # that shell — typed in, not exec'd, so you drop back to a live shell when it exits.
  # `load_on_open` spawns the tab at launch and keeps it running for background work; other tabs
  # spawn lazily on first focus.
  # [[window.tab]]
  #   title        = "dotfiles"
  #   dir          = "~/dotfiles"
  #   shell        = "fish -l"
  #   load_on_open = true

  # `shell`, `cmd`, and `probe` CASCADE: set them globally, per-window, or per-tab — the nearest
  # level wins. A missing value inherits from above; `cmd = ""` opts a level out of an inherited
  # cmd. Tabs can be grouped: a [[window.group]] (with a `name`) holds its own
  # [[window.group.tab]]s and renders as a labelled section in the sidebar.
  # [[window.group]]
  #   name = "backend"
  #   [[window.group.tab]]
  #     title = "api"
  #     dir   = "~/work/api"

  # A [[window.root]] auto-discovers git projects under a `dir` instead of listing tabs by hand —
  # each one becomes a tab in a collapsible tree section. Roots cascade shell/cmd/probe/kill just
  # like tabs (root -> window -> global, no tab level).
  # [[window.root]]
  #   dir = "~/Developer"

  # A per-tab "session exists" dot: warden runs `probe` (cwd = the tab's dir) on a timer and
  # lights a cyan dot when it exits 0. `kill` (optional) tears the session down when you confirm
  # killing the tab. Both cascade like `shell`/`cmd`.
  # [[window.tab]]
  #   title = "agent"
  #   dir   = "~/work/agent"
  #   probe = "some-check --probe"
  #   kill  = "some-check --kill"
