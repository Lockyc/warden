[package]
name = "warden-config"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
notify = "8"
dirs = "7"
# Shared house-style TOML formatter + colour parsing (formerly warden's own fmt.rs/colour.rs),
# now lifted into config-core and shared with curator and lector. Git dep so the build needs
# no extra setup. Pinned by rev (same class as the libghostty pin) — config-core's formatter
# is warden's source of truth for format-on-save, so a HEAD bump must be deliberate, not
# floated by `cargo update`.
config-core = { git = "https://github.com/Lockyc/config-core", rev = "69b38586661ff44df21f01d715484792014cdd82" }
# Used by load.rs / watch.rs tests for temp config dirs.
tempfile = "3"

[[bin]]
name = "warden"
path = "src/bin/warden.rs"
